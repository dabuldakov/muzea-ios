name: Checks

# Быстрые проверки без macOS-минут: ключи локализации и синтаксис Swift.
on:
  push:
    branches: [main]
    paths:
      - "Muzea/**"
      - "MuzeaTests/**"
      - "scripts/**"
      - ".github/workflows/checks.yml"
      - ".swiftlint.yml"
  pull_request:
  workflow_dispatch:

jobs:
  localization:
    name: Localization keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check localization tables
        run: python3 scripts/check_localization.py

  release-config:
    name: Release config and security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Info.plist, PrivacyInfo, AASA and secrets
        run: python3 scripts/check_release.py

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Linux-бинарник SwiftLint + toolchain из того же образа, что и parse:
      # macOS-раннеры дорогие и периодически недоступны по capacity.
      - name: Lint Swift sources
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            swift:6.0 \
            bash -lc 'apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null && curl -sSL -o /tmp/sl.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip && unzip -q /tmp/sl.zip -d /tmp && LD_LIBRARY_PATH=/usr/lib/swift/linux /tmp/swiftlint lint --config .swiftlint.yml --no-cache --reporter github-actions-logging'

  swift-syntax:
    name: Swift syntax (parse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Parse Swift sources
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            swift:6.0 \
            bash -lc 'find Muzea MuzeaTests -name "*.swift" -print0 | xargs -0 swiftc -parse'
