name: Checks

# Быстрые проверки без macOS-минут: ключи локализации и синтаксис Swift.
on:
  push:
    branches: [main]
    paths:
      - "Muzea/**"
      - "MuzeaTests/**"
      - "scripts/**"
      - ".github/workflows/checks.yml"
      - ".swiftlint.yml"
  pull_request:
  workflow_dispatch:

jobs:
  localization:
    name: Localization keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check localization tables
        run: python3 scripts/check_localization.py

  release-config:
    name: Release config and security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Info.plist, PrivacyInfo, AASA and secrets
        run: python3 scripts/check_release.py

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  swift-syntax:
    name: Swift syntax (parse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Parse Swift sources
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            swift:6.0 \
            bash -lc 'find Muzea MuzeaTests -name "*.swift" -print0 | xargs -0 swiftc -parse'
