name: TestFlight

# Ручной запуск: загружает подписанную сборку в TestFlight.
# Не входит в основной ios.yml, чтобы отсутствие секретов не ломало CI.
#
# Требуемые GitHub Secrets:
#   APPLE_TEAM_ID                 — Team ID (Apple Developer → Membership)
#   APP_STORE_CONNECT_ISSUER_ID   — App Store Connect API key Issuer ID
#   APP_STORE_CONNECT_KEY_ID      — Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY — содержимое .p8 (целиком)
#
# Опционально (repository variable): IOS_BUNDLE_ID, по умолчанию com.cyber.muzea.
# Bundlе ID должен быть создан в App Store Connect.

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What to test (TestFlight)"
        required: false
        default: ""

concurrency:
  # Общий group с ios.yml: одновременно нужен только один macOS-раннер.
  group: ios-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check entitlements (push)
        run: python3 scripts/check_entitlements.py

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Check required secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in TEAM_ID ISSUER_ID KEY_ID PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit "$missing"

      - name: Write GoogleService-Info.plist (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > Muzea/Resources/GoogleService-Info.plist
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # altool ищет ключ в ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir" "$RUNNER_TEMP/keys"
          printf '%s' "$PRIVATE_KEY" > "$dir/AuthKey_${KEY_ID}.p8"
          cp "$dir/AuthKey_${KEY_ID}.p8" "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$dir/AuthKey_${KEY_ID}.p8"


      - name: Install signing identity and profiles
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP }}
          PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12"             -k "$KEYCHAIN"             -P "$P12_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_APP_BASE64" | base64 --decode > "$PROFILE_DIR/muzea.mobileprovision"
          echo "$PROFILE_SHARE_BASE64" | base64 --decode > "$PROFILE_DIR/muzea-share.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive (automatic signing)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Muzea.xcodeproj \
            -scheme Muzea \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Muzea.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            KLIPY_APP_KEY="$KLIPY_APP_KEY"

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cyber.muzea</key><string>Muzea App Store</string>
              <key>com.cyber.muzea.Share</key><string>Muzea Share App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Muzea.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Verify push entitlement in signed app
        run: |
          set -euo pipefail
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          rm -rf build/entitlements-check
          mkdir -p build/entitlements-check
          unzip -q "$IPA" -d build/entitlements-check
          APP="build/entitlements-check/Payload/Muzea.app"
          test -d "$APP" || { echo "::error::Muzea.app not found in ipa"; exit 1; }
          codesign -d --entitlements :- "$APP" 2>/dev/null > build/entitlements.plist
          python3 - <<'PY'
          import plistlib
          data = plistlib.load(open('build/entitlements.plist', 'rb'))
          aps = data.get('aps-environment')
          print('aps-environment:', aps)
          if aps != 'production':
              raise SystemExit('::error::aps-environment должен быть production')
          PY

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' -maxdepth 1 | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muzea-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: warn

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
