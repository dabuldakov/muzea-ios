name: Muzea
options:
  bundleIdPrefix: com.cyber
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Подпись настраивает конкретная сборка: симулятор/unsigned IPA передают
    # CODE_SIGNING_ALLOWED=NO, TestFlight — YES. Глобальный NO ломал подпись
    # архива и оставлял его без entitlements (включая push).
    # Klipy GIF: значение подставляет окружение/CI, чтобы ключ не жил в git.
    KLIPY_APP_KEY: ""

targets:
  Muzea:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Muzea
        excludes:
          - "Resources/Info.plist"
    entitlements:
      path: Muzea/Resources/Muzea.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:muzea.su
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyber.muzea
        PRODUCT_NAME: Muzea
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Muzea/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Automatic
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Muzea App Store"
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - target: MuzeaShare
        embed: true

  MuzeaShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MuzeaShare
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyber.muzea.Share
        PRODUCT_NAME: MuzeaShare
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: MuzeaShare/Info.plist
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "13"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Muzea Share App Store"

  MuzeaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MuzeaTests
    dependencies:
      - target: Muzea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyber.muzea.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Muzea.app/Muzea"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Muzea:
    build:
      targets:
        Muzea: all
    test:
      config: Debug
      targets:
        - MuzeaTests
    run:
      config: Debug
    archive:
      config: Release
