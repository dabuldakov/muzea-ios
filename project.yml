name: Muzea
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Muzea:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Muzea
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.muzea
        PRODUCT_NAME: Muzea
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Muzea/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    dependencies:
      - package: Firebase
        product: FirebaseMessaging

  MuzeaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MuzeaTests
    dependencies:
      - target: Muzea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.muzea.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Muzea.app/Muzea"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Muzea:
    build:
      targets:
        Muzea: all
    test:
      config: Debug
      targets:
        - MuzeaTests
    run:
      config: Debug
    archive:
      config: Release
