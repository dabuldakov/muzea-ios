excluded:
  - .build
  - Muzea.xcodeproj
  - build
  # В тестах допустимы force-unwrap и длинные фикстуры: линтуем прод-код.
  - MuzeaTests

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - todo
  - trailing_whitespace
  - large_tuple

opt_in_rules:
  - empty_count
  - force_unwrapping
  - unused_optional_binding

# Пока это предупреждения: сначала убираем самые опасные места, потом
# переводим в ошибки и включаем --strict.
force_cast: warning
force_try: warning
force_unwrapping: warning

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y

empty_count: warning


# API репозиториев повторяет контракт сервера; 8 — рабочий предел.
function_parameter_count:
  warning: 8
  error: 10
